<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <title>Francis Legaspi | Channel</title>
  <style>
    :root { --bg:#0b0f19; --surface:#1c1f2b; --text:#f0f1f8; --muted:#a3a6b7; --purple:#a855f7; --indigo:#6366f1; --green:#6ee7b7; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); font-family:"Segoe UI",Arial,sans-serif; } button { font:inherit; }
    .topbar { position:sticky; top:0; z-index:5; height:70px; display:flex; align-items:center; gap:24px; padding:0 max(20px,calc((100% - 1380px)/2)); border-bottom:1px solid rgba(255,255,255,.08); background:rgba(11,15,25,.92); backdrop-filter:blur(16px); }.brand { display:flex; flex-shrink:0; align-items:center; gap:10px; color:white; font-size:1rem; font-weight:800; letter-spacing:.03em; text-decoration:none; }.brand img { width:38px; height:38px; object-fit:contain; border-radius:10px; }.search { flex:1; max-width:570px; margin:auto; position:relative; }.search input { width:100%; height:39px; padding:0 42px 0 15px; border:1px solid rgba(255,255,255,.14); border-radius:9px; outline:0; color:white; background:#202431; }.search input:focus { border-color:#9b8cff; }.search span { position:absolute; right:14px; top:9px; color:#b8b9c8; }.back { padding:9px 14px; border:1px solid rgba(255,255,255,.16); border-radius:999px; color:#e4e4ee; font-size:.82rem; font-weight:700; text-decoration:none; }
    .channel-banner { height:180px; background:radial-gradient(circle at 76% 28%,rgba(168,85,247,.42),transparent 20rem),linear-gradient(115deg,#202d61,#241b43 55%,#121725); }.container { width:min(1320px,calc(100% - 40px)); margin:auto; }.channel-head { display:flex; gap:22px; align-items:end; padding:0 0 25px; margin-top:-59px; }.avatar { width:130px; height:130px; flex:0 0 130px; border:4px solid var(--bg); border-radius:50%; object-fit:cover; object-position:center 24%; background:#303545; }.channel-info { padding-bottom:3px; }.channel-info h1 { margin:0; font-size:clamp(1.8rem,4vw,2.7rem); letter-spacing:-.055em; }.channel-info p { margin:6px 0 0; color:var(--muted); font-size:.9rem; }.channel-actions { margin-left:auto; padding-bottom:4px; }.subscribe { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 18px; border:0; border-radius:999px; color:white; background:linear-gradient(105deg,var(--indigo),var(--purple)); font-size:.85rem; font-weight:800; text-decoration:none; }
    .tabs { display:flex; gap:27px; border-bottom:1px solid rgba(255,255,255,.1); }.tabs a { padding:15px 0 12px; border-bottom:3px solid transparent; color:var(--muted); font-size:.84rem; font-weight:800; text-decoration:none; }.tabs a.active { border-color:#a78bfa; color:white; }.content { padding:30px 0 55px; }.content-head { display:flex; align-items:end; justify-content:space-between; gap:15px; margin-bottom:20px; }.content-head h2 { margin:0; font-size:1.42rem; letter-spacing:-.03em; }.content-head span { color:var(--muted); font-size:.82rem; }.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px 16px; }.media-card { min-width:0; cursor:pointer; }.thumb { position:relative; aspect-ratio:16/9; overflow:hidden; border:1px solid rgba(255,255,255,.08); border-radius:11px; background:#161a25; }.thumb video,.thumb img { width:100%; height:100%; display:block; object-fit:cover; }.thumb video { pointer-events:none; }.kind { position:absolute; right:8px; bottom:8px; padding:4px 7px; border-radius:5px; color:white; background:rgba(5,6,10,.78); font-size:.65rem; font-weight:800; letter-spacing:.04em; }.play { position:absolute; left:10px; bottom:8px; display:grid; place-items:center; width:29px; height:29px; padding-left:2px; border-radius:50%; color:white; background:rgba(6,8,13,.74); font-size:.7rem; }.media-card:hover .thumb { outline:2px solid rgba(168,85,247,.7); }.media-card h3 { overflow:hidden; margin:9px 0 3px; color:#e8e9f1; font-size:.9rem; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }.media-card p { margin:0; color:#9094a5; font-size:.76rem; }
    .modal { position:fixed; inset:0; z-index:10; display:none; place-items:center; padding:22px; background:rgba(5,7,12,.72); backdrop-filter:blur(7px); }.modal.open { display:grid; }.modal-box { width:min(100%,1240px); max-height:92vh; overflow:auto; padding:17px; border:1px solid rgba(255,255,255,.15); border-radius:16px; background:#1c2130; box-shadow:0 28px 90px rgba(0,0,0,.46); }.modal-top { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:0 2px 13px; }.modal-top strong { font-size:.96rem; }.close { width:34px; height:34px; border:0; border-radius:50%; color:#fff; background:#303444; font-size:22px; cursor:pointer; }.player-layout { display:grid; grid-template-columns:minmax(0,1fr) 215px; gap:17px; }.player-stage { position:relative; overflow:hidden; border-radius:18px; background:#2a3144; aspect-ratio:16/9; }.viewer { display:block; width:100%; height:100%; background:#2a3144; object-fit:cover; }.viewer.image { object-fit:contain; }.player-controls { position:absolute; right:14px; bottom:14px; left:14px; display:flex; justify-content:space-between; align-items:center; }.control-group { display:flex; gap:8px; }.player-control { display:grid; place-items:center; width:38px; height:38px; border:1px solid rgba(255,255,255,.25); border-radius:50%; color:white; background:rgba(19,24,37,.74); font-size:16px; cursor:pointer; backdrop-filter:blur(6px); }.player-control:hover { background:rgba(99,102,241,.8); }.player-title { position:absolute; top:16px; left:17px; padding:7px 10px; border-radius:8px; color:white; background:rgba(19,24,37,.65); font-size:.78rem; font-weight:700; }.suggested h3 { margin:2px 0 11px; color:#f1f1f7; font-size:.95rem; }.suggestion { display:grid; grid-template-columns:83px 1fr; gap:8px; width:100%; margin-bottom:10px; padding:0; border:0; color:#d7d9e5; background:transparent; text-align:left; cursor:pointer; }.suggestion-video { height:56px; overflow:hidden; border-radius:7px; background:#2a3144; }.suggestion-video video { width:100%; height:100%; object-fit:cover; }.suggestion span { overflow:hidden; font-size:.74rem; font-weight:700; line-height:1.35; text-overflow:ellipsis; }.suggestion small { display:block; margin-top:3px; color:#8f93a4; font-size:.66rem; }.empty { grid-column:1/-1; padding:30px; border-radius:12px; color:var(--muted); background:var(--surface); text-align:center; }
    @media(max-width:1000px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }.avatar { width:110px; height:110px; flex-basis:110px; }.channel-head { margin-top:-48px; }.channel-banner { height:150px; }
    @media(max-width:680px) { .topbar { height:62px; gap:10px; padding:0 14px; }.brand span { display:none; }.search { max-width:none; }.back { display:none; }.container { width:min(100% - 28px,1320px); }.channel-banner { height:115px; }.channel-head { align-items:center; gap:14px; margin-top:-35px; padding-bottom:20px; }.avatar { width:82px; height:82px; flex-basis:82px; }.channel-info h1 { font-size:1.55rem; }.channel-info p { font-size:.76rem; }.channel-actions { display:none; }.tabs { gap:20px; }.grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:19px 11px; }.content { padding-top:22px; }.content-head h2 { font-size:1.2rem; }.modal { padding:9px; }.modal-box { padding:12px; }.player-layout { grid-template-columns:1fr; }.suggested { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }.suggested h3 { grid-column:1/-1; }.suggestion { grid-template-columns:70px 1fr; margin:0; }.suggestion-video { height:48px; } }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="profile.html"><img src="photos/logo.png" alt="TG CHANNEL logo"><span>TG CHANNEL</span></a><label class="search"><input id="search" type="search" placeholder="Search this channel"><span>⌕</span></label><a class="back" href="profile.html">Back to profile</a></header>
  <section class="channel-banner"></section>
  <main class="container"><section class="channel-head"><img class="avatar" src="photos/profile.png" alt="Francis Legaspi"><div class="channel-info"><h1>Francis Legaspi</h1><p>@francislegaspi · 1.7K subscribers · 121 uploads</p></div><div class="channel-actions"><a class="subscribe" href="profile.html#subscribeBtn">Subscribe</a></div></section><nav class="tabs"><a href="profile.html">HOME</a><a class="active" href="channel.html">VIDEOS</a><a href="preview.html">PREVIEWS</a></nav><section class="content"><div class="content-head"><h2>Uploads</h2><span id="count">121 items</span></div><div class="grid" id="mediaGrid"></div></section></main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Media viewer"><div class="modal-box"><div class="modal-top"><strong id="modalTitle"></strong><button class="close" type="button" aria-label="Close viewer">×</button></div><div id="viewerHost"></div></div></div>
  <script>
    const media = ["1.MP4","2-1.mp4","2-2.mp4","3-1.MP4","3-2.MP4","3-3.mp4","3-4.mp4","3-5.MP4","3-6.mp4","3-7.MP4","4.mp4","5.mp4","6.mp4","7-1.jpeg","7-2.jpeg","7-3.jpeg","7-4.jpeg","7-5.jpeg","8.mp4","9.MOV","10.MOV","11.MOV","12.MOV","13.MOV","14.MOV","15.MOV","16.MOV","17.MOV","18.MOV","19.MOV","20.MOV","21.MOV","22.MOV","23.MOV","24.MOV","25.MOV","26-1.MOV","26-2.MOV","27.MOV","28.MOV","29.MOV","30.MOV","31.MOV","32-1.MOV","32-2.MOV","33-1.MOV","33-2.MOV","34.MOV","35.jpeg","36.MOV","37.MOV","38.MOV","39.MOV","40.MOV","41.MOV","42.MOV","43-1.MOV","43-2.MOV","44.MOV","45.MOV","46.MOV","47.MOV","48.MOV","49.MOV","50.MOV","51.MOV","52.MOV","53.jpeg","54.jpeg","55.MOV","56-1.MOV","56-2.MOV","57.MOV","58.MOV","59.MOV","60.MOV","61.jpeg","62.MOV","63.MOV","64.MOV","65.MOV","66.MOV","67.jpeg","68.MOV","69.MOV","70.MOV","71.MOV","72.MOV","73.jpeg","74.MOV","75.MOV","76.MOV","77.MOV","78.MP4","79.MOV","80.MOV","81-1.jpeg","81-2.jpeg","82.jpeg","83.jpeg","84.mp4","85.mp4","86.mp4","87.mp4","88.mp4","89.MOV","90.MOV","91.MOV","92.MOV","93.MOV","94.MOV","95.MOV","96.MOV","97.MP4","98.MOV","99.MOV","100.MOV","101.MOV","102.MOV","103.MOV","104.MP4"];
    const grid = document.getElementById('mediaGrid'), modal = document.getElementById('modal'), title = document.getElementById('modalTitle'), host = document.getElementById('viewerHost');
    const isImage = name => /\.(jpeg|jpg|png|webp)$/i.test(name);
    function label(name) { return `Post ${name.replace(/\.[^.]+$/, '')}`; }
    function render(items) { grid.innerHTML = ''; document.getElementById('count').textContent = `${items.length} item${items.length === 1 ? '' : 's'}`; if (!items.length) { grid.innerHTML = '<div class="empty">No uploads match your search.</div>'; return; } items.forEach(name => { const image = isImage(name), card = document.createElement('article'); card.className = 'media-card'; card.innerHTML = `<div class="thumb">${image ? `<img src="channel/${name}" alt="${label(name)}" loading="lazy">` : `<video src="channel/${name}" preload="metadata" muted playsinline></video><span class="play">▶</span>`}<span class="kind">${image ? 'PHOTO' : 'VIDEO'}</span></div><h3>${label(name)}</h3><p>${name}</p>`; card.addEventListener('click', () => openMedia(name)); grid.appendChild(card); }); }
    function openMedia(name) { const image = isImage(name); title.textContent = `${label(name)} · ${name}`; if (image) { host.innerHTML = `<img class="viewer image" src="channel/${name}" alt="${label(name)}">`; modal.classList.add('open'); return; } const suggestions = media.filter(item => !isImage(item) && item !== name).slice(0, 5); host.innerHTML = `<div class="player-layout"><div class="player-stage" id="playerStage"><video class="viewer" id="activeVideo" src="channel/${name}" autoplay playsinline></video><span class="player-title">${label(name)}</span><div class="player-controls"><div class="control-group"><button class="player-control" id="playToggle" type="button" aria-label="Pause video">❚❚</button><button class="player-control" id="muteToggle" type="button" aria-label="Mute video">♩</button></div><button class="player-control" id="fullscreenToggle" type="button" aria-label="Fullscreen">⛶</button></div></div><aside class="suggested"><h3>Suggested videos</h3>${suggestions.map(item => `<button class="suggestion" type="button" data-video="${item}"><span class="suggestion-video"><video src="channel/${item}" muted preload="metadata" playsinline></video></span><span>${label(item)}<small>${item}</small></span></button>`).join('')}</aside></div>`; modal.classList.add('open'); const video = document.getElementById('activeVideo'), play = document.getElementById('playToggle'), mute = document.getElementById('muteToggle'); video.muted = false; function updatePlay() { play.textContent = video.paused ? '▶' : '❚❚'; play.setAttribute('aria-label', video.paused ? 'Play video' : 'Pause video'); } function updateMute() { mute.textContent = video.muted ? '♩' : '♪'; mute.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video'); } play.addEventListener('click', () => video.paused ? video.play() : video.pause()); mute.addEventListener('click', () => { video.muted = !video.muted; updateMute(); }); video.addEventListener('play', updatePlay); video.addEventListener('pause', updatePlay); document.getElementById('fullscreenToggle').addEventListener('click', () => { const stage = document.getElementById('playerStage'); if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen?.(); }); document.querySelectorAll('[data-video]').forEach(button => button.addEventListener('click', () => openMedia(button.dataset.video))); updatePlay(); updateMute(); }
    function closeModal() { modal.classList.remove('open'); host.innerHTML = ''; }
    document.querySelector('.close').addEventListener('click', closeModal); modal.addEventListener('click', event => { if (event.target === modal) closeModal(); }); document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    const newestFirst = items => [...items].sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }));
    document.getElementById('search').addEventListener('input', event => { const term = event.target.value.trim().toLowerCase(); render(newestFirst(media.filter(name => label(name).toLowerCase().includes(term) || name.toLowerCase().includes(term)))); });
    render(newestFirst(media));
  </script>
</body>
</html>
